version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: golbat-redis
    restart: always
    ports:
      - "0.0.0.0:6379:6379"  # For separate VM deployment
    command: >
      redis-server
      --bind 0.0.0.0
      --protected-mode no
      --requirepass YOUR_REDIS_PASSWORD_HERE
      --appendonly yes
      --appendfsync everysec
      --maxmemory 100gb
      --maxmemory-policy allkeys-lru
      --save 3600 1
      --save 1800 100
      --save 900 1000
      --tcp-backlog 4096
      --timeout 0
      --tcp-keepalive 300
      --maxclients 50000
      --loglevel notice
      --stop-writes-on-bgsave-error no
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "YOUR_REDIS_PASSWORD_HERE", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - golbat-network

  # Optional: Redis Commander for web-based Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: golbat-redis-commander
    restart: always
    environment:
      - REDIS_HOSTS=local:golbat-redis:6379:0:YOUR_REDIS_PASSWORD_HERE
    ports:
      - "8081:8081"
    networks:
      - golbat-network
    depends_on:
      - redis

volumes:
  redis-data:
    driver: local

networks:
  golbat-network:
    driver: bridge

